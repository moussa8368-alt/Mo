name: Compile MQL
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Telecharger MetaEditor
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile "mt5setup.exe"
          Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto" -Wait

      - name: Compiler le robot
        run: |
          $metaeditor = Get-ChildItem -Path "C:\Program Files" -Filter "metaeditor64.exe" -Recurse | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "C:\Build"
          Copy-Item "BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5" -Destination "C:\Build\BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5"
          & $metaeditor.FullName /compile:"C:\Build\BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5" /log:"C:\Build\compile.log"
          Get-Content "C:\Build\compile.log" -Encoding Unicode

      - name: Recuperer le fichier compile
        uses: actions/upload-artifact@v4
        with:
          name: Robot-Compile
          path: C:\Build\*.ex5
          

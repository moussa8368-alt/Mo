name: Compile MQL

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer MetaTrader 5
        shell: pwsh
        run: |
          $buildDir = "C:\Build"

          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null

          Write-Host "Telechargement de MT5..."

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile "$buildDir\mt5setup.exe"

          Start-Process `
            -FilePath "$buildDir\mt5setup.exe" `
            -ArgumentList "/auto" `
            -Wait

          Write-Host "Installation de MT5 terminee."

      - name: Trouver MetaEditor
        shell: pwsh
        run: |
          Write-Host "Recherche de MetaEditor64.exe..."

          $metaeditor = Get-ChildItem `
            -Path "C:\Program Files" `
            -Filter "metaeditor64.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $metaeditor) {
            $metaeditor = Get-ChildItem `
              -Path "C:\Program Files (x86)" `
              -Filter "metaeditor64.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $metaeditor) {
            Write-Error "MetaEditor64.exe introuvable."
            exit 1
          }

          Write-Host "MetaEditor trouve :"
          Write-Host $metaeditor.FullName

          # Sauvegarde du chemin de MetaEditor uniquement
          "METAEDITOR_PATH=$($metaeditor.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Compiler le robot
        shell: pwsh
        run: |

          $buildDir = "C:\Build"
          $logFile = "$buildDir\compile.log"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $buildDir | Out-Null

          Write-Host "========================================"
          Write-Host "RECHERCHE DU FICHIER MQ5"
          Write-Host "========================================"

          $sourceFile = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $sourceFile) {
            Write-Error "Le fichier BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5 est introuvable."

            Write-Host ""
            Write-Host "Fichiers MQ5 presents dans le depot :"

            Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Filter "*.mq5" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host $_.FullName
              }

            exit 1
          }

          Write-Host "Fichier MQ5 trouve :"
          Write-Host $sourceFile.FullName

          Write-Host ""
          Write-Host "========================================"
          Write-Host "COMPILATION MQL5"
          Write-Host "========================================"

          Write-Host "MetaEditor : $env:METAEDITOR_PATH"
          Write-Host "Source     : $($sourceFile.FullName)"
          Write-Host "Log        : $logFile"

          Write-Host ""

          & "$env:METAEDITOR_PATH" `
            "/compile:$($sourceFile.FullName)" `
            "/log:$logFile"

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Code retour MetaEditor : $exitCode"

          if (Test-Path $logFile) {

            Write-Host ""
            Write-Host "========== LOG COMPILATION =========="

            Get-Content `
              $logFile `
              -Encoding Unicode `
              -ErrorAction SilentlyContinue

            Write-Host "====================================="
          }

          Write-Host ""
          Write-Host "Recherche du fichier EX5..."

          # Le fichier EX5 est normalement genere a cote du MQ5
          $sourceDirectory = $sourceFile.DirectoryName

          $ex5Files = Get-ChildItem `
            -Path $sourceDirectory `
            -Filter "*.ex5" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $ex5Files) {

            Write-Error "Aucun fichier EX5 n'a ete genere."

            Write-Host ""
            Write-Host "Contenu du dossier source :"

            Get-ChildItem `
              -Path $sourceDirectory `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length |
              Format-Table -AutoSize

            exit 1
          }

          Write-Host ""
          Write-Host "EX5 trouve :"

          foreach ($file in $ex5Files) {
            Write-Host $file.FullName
          }

          # Cherche en priorite le EX5 correspondant au MQ5
          $expectedName = [System.IO.Path]::GetFileNameWithoutExtension(
            $sourceFile.Name
          ) + ".ex5"

          $mainEx5 = $ex5Files |
            Where-Object {
              $_.Name -eq $expectedName
            } |
            Select-Object -First 1

          if (-not $mainEx5) {
            $mainEx5 = $ex5Files | Select-Object -First 1
          }

          Write-Host ""
          Write-Host "EX5 selectionne :"
          Write-Host $mainEx5.FullName

          Copy-Item `
            -Path $mainEx5.FullName `
            -Destination "$buildDir\$($mainEx5.Name)" `
            -Force

          Write-Host ""
          Write-Host "Fichier final :"
          Write-Host "$buildDir\$($mainEx5.Name)"

          if ($exitCode -ne 0) {
            Write-Error "MetaEditor a retourne le code $exitCode."
            exit $exitCode
          }

      - name: Recuperer le fichier compile
        uses: actions/upload-artifact@v4
        with:
          name: Robot-Compile
          path: C:\Build\*.ex5
          if-no-files-found: error

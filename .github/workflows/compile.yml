name: Compile MQL
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Telecharger et lancer mt5setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Build" | Out-Null
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile "C:\Build\mt5setup.exe"
          Start-Process -FilePath "C:\Build\mt5setup.exe" -ArgumentList "/auto" -Wait

      - name: Compiler le robot
        shell: pwsh
        run: |
          $metaeditor = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $metaeditor) {
            Write-Host "metaeditor64.exe introuvable"
            exit 1
          }
          $sourceFile = Get-ChildItem -Path "C:\" -Filter "BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          & $metaeditor.FullName /compile:"$($sourceFile.FullName)" /log:"C:\Build\compile.log"
          if (Test-Path "C:\Build\compile.log") {
            Get-Content "C:\Build\compile.log" -Encoding Unicode
          }
          Get-ChildItem -Path "C:\" -Filter "*.ex5" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Trouve EX5: $($_.FullName)"
            Copy-Item $_.FullName -Destination "C:\Build\$($_.Name)" -Force
          }

      - name: Recuperer le fichier compile
        uses: actions/upload-artifact@v4
        with:
          name: Robot-Compile
          path: C:\Build\*.ex5
          if-no-files-found: error

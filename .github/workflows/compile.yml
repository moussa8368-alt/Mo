
name: Compile MQL5

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. RECUPERER LE CODE
      # ============================================================
      - name: Recuperer le code
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALLER METATRADER 5
      # ============================================================
      - name: Installer MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $BuildDir = "C:\Build"
          New-Item -ItemType Directory -Force -Path $BuildDir | Out-Null

          $Installer = "$BuildDir\mt5setup.exe"

          Write-Host "TELECHARGEMENT DE METATRADER 5"

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $Installer

          Write-Host "INSTALLATION DE METATRADER 5"

          $Process = Start-Process `
            -FilePath $Installer `
            -ArgumentList "/auto" `
            -Wait `
            -PassThru

          if ($Process.ExitCode -ne 0) {
            throw "Installation MT5 echouee : $($Process.ExitCode)"
          }

          Write-Host "Installation terminee."

      # ============================================================
      # 3. TROUVER METAEDITOR
      # ============================================================
      - name: Trouver MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "RECHERCHE METAEDITOR"

          $Candidates = @(
            "C:\Program Files\MetaTrader 5\MetaEditor64.exe",
            "C:\Program Files (x86)\MetaTrader 5\MetaEditor64.exe"
          )

          $MetaEditor = $null

          foreach ($Path in $Candidates) {
            if (Test-Path $Path) {
              $MetaEditor = $Path
              break
            }
          }

          if (-not $MetaEditor) {
            foreach ($Root in @(
              "C:\Program Files",
              "C:\Program Files (x86)"
            )) {
              if (Test-Path $Root) {
                $Found = Get-ChildItem `
                  -Path $Root `
                  -Filter "MetaEditor64.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($Found) {
                  $MetaEditor = $Found.FullName
                  break
                }
              }
            }
          }

          if (-not $MetaEditor) {
            throw "MetaEditor64.exe introuvable."
          }

          Write-Host "MetaEditor trouve : $MetaEditor"

          "METAEDITOR_PATH=$MetaEditor" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      # ============================================================
      # 4. TROUVER LE ROBOT MQ5
      # ============================================================
      - name: Trouver le robot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $SourceName = "BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5"

          $SourceFile = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $SourceName `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $SourceFile) {
            throw "Robot introuvable : $SourceName"
          }

          Write-Host "ROBOT TROUVE : $($SourceFile.FullName)"

          "SOURCE_FILE=$($SourceFile.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      # ============================================================
      # 5. INITIALISER L'ENVIRONNEMENT MQL5
      # ============================================================
      - name: Initialiser l'environnement MQL5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "INITIALISATION MQL5"

          $TerminalRoot = Split-Path $env:METAEDITOR_PATH -Parent

          $TradeMqh = Join-Path `
            $TerminalRoot `
            "MQL5\Include\Trade\Trade.mqh"

          # Recherche alternative si la bibliotheque
          # n'est pas dans le repertoire de MetaEditor.
          if (-not (Test-Path $TradeMqh)) {

            Write-Host "Recherche alternative de Trade.mqh"

            $TradeFound = $null

            foreach ($Root in @(
              "C:\Program Files",
              "C:\Program Files (x86)"
            )) {
              if (Test-Path $Root) {
                $TradeFound = Get-ChildItem `
                  -Path $Root `
                  -Filter "Trade.mqh" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($TradeFound) {
                  break
                }
              }
            }

            if (-not $TradeFound) {
              throw "Trade.mqh introuvable."
            }

            $TradeMqh = $TradeFound.FullName
          }

          $IncludeRoot = Split-Path `
            (Split-Path $TradeMqh -Parent) `
            -Parent

          $MQL5Root = Split-Path $IncludeRoot -Parent

          $Experts = Join-Path $MQL5Root "Experts"

          if (-not (Test-Path $TradeMqh)) {
            throw "Bibliotheque Trade.mqh invalide."
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $Experts | Out-Null

          Write-Host "Bibliotheque : $TradeMqh"
          Write-Host "MQL5 Root : $MQL5Root"

          Copy-Item `
            -Path $env:SOURCE_FILE `
            -Destination $Experts `
            -Force

          "MQL5_ROOT=$MQL5Root" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          Write-Host "ENVIRONNEMENT MQL5 PRET"

      # ============================================================
      # 6. VERIFIER LES BIBLIOTHEQUES
      # ============================================================
      - name: Verifier les bibliotheques MQL5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Include = Join-Path $env:MQL5_ROOT "Include"

          $RequiredFiles = @(
            "Trade\Trade.mqh",
            "Trade\PositionInfo.mqh",
            "Trade\OrderInfo.mqh",
            "Trade\HistoryOrderInfo.mqh",
            "Trade\DealInfo.mqh",
            "Trade\SymbolInfo.mqh"
          )

          foreach ($File in $RequiredFiles) {

            $Path = Join-Path $Include $File

            if (-not (Test-Path $Path)) {
              throw "Bibliotheque absente : $Path"
            }

            Write-Host "OK : $File"
          }

          $Files = Get-ChildItem `
            -Path $Include `
            -Filter "*.mqh" `
            -File `
            -Recurse

          Write-Host "Nombre de fichiers MQH : $($Files.Count)"

      # ============================================================
      # 7. COMPILER LE ROBOT
      # ============================================================
      - name: Compiler le robot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $BuildDir = "C:\Build"
          $LogFile = "$BuildDir\compile.log"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $BuildDir | Out-Null

          $SourceName = Split-Path $env:SOURCE_FILE -Leaf

          $SourceCopy = Join-Path `
            (Join-Path $env:MQL5_ROOT "Experts") `
            $SourceName

          $EX5Name = [System.IO.Path]::ChangeExtension(
            $SourceName,
            ".ex5"
          )

          $ExpectedEX5 = Join-Path `
            (Join-Path $env:MQL5_ROOT "Experts") `
            $EX5Name

          Write-Host "================================="
          Write-Host "COMPILATION MQL5"
          Write-Host "================================="

          Write-Host "MetaEditor : $env:METAEDITOR_PATH"
          Write-Host "Source : $SourceCopy"
          Write-Host "EX5 attendu : $ExpectedEX5"

          if (-not (Test-Path $SourceCopy)) {
            throw "Fichier source introuvable."
          }

          if (Test-Path $LogFile) {
            Remove-Item $LogFile -Force
          }

          if (Test-Path $ExpectedEX5) {
            Remove-Item $ExpectedEX5 -Force
          }

          $Arguments = @(
            "/compile:`"$SourceCopy`"",
            "/log:`"$LogFile`""
          )

          $Process = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList $Arguments `
            -Wait `
            -PassThru

          Write-Host "Code retour MetaEditor : $($Process.ExitCode)"

          Start-Sleep -Seconds 3

          if (-not (Test-Path $LogFile)) {
            throw "Journal de compilation introuvable."
          }

          $LogContent = Get-Content $LogFile -Raw

          Write-Host "================================="
          Write-Host "JOURNAL DE COMPILATION"
          Write-Host "================================="

          Write-Host $LogContent

          # Detecter les erreurs de compilation.
          if ($LogContent -match '(?i)\b[1-9]\d*\s+errors?\b') {
            throw "La compilation contient des erreurs."
          }

          # Verifier le fichier EX5.
          if (-not (Test-Path $ExpectedEX5)) {
            throw "Le fichier EX5 n'a pas ete genere."
          }

          $EX5 = Get-Item $ExpectedEX5

          if ($EX5.Length -eq 0) {
            throw "Le fichier EX5 est vide."
          }

          # Copier le resultat dans Build.
          Copy-Item `
            -Path $ExpectedEX5 `
            -Destination "$BuildDir\$EX5Name" `
            -Force

          Write-Host "================================="
          Write-Host "COMPILATION TERMINEE"
          Write-Host "================================="

          Write-Host "EX5 : $BuildDir\$EX5Name"
          Write-Host "Taille : $($EX5.Length) octets"

      # ============================================================
      # 8. RECUPERER LES ARTIFACTS
      # ============================================================
      - name: Recuperer le fichier compile
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Robot-Compile
          path: |
            C:\Build\*.ex5
            C:\Build\compile.log
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 9. CONSERVER LES LOGS EN CAS D'ECHEC
      # ============================================================
      - name: Recuperer le journal en cas d'erreur
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Compilation-Logs
          path: |
            C:\Build\compile.log
          if-no-files-found: ignore
          retention-days: 30

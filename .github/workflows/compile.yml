name: Compile MQL5

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. RECUPERATION DU DEPOT
      # ============================================================
      - name: Recuperer le code
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALLATION DE METATRADER 5
      # ============================================================
      - name: Installer MetaTrader 5
        shell: pwsh
        run: |
          $buildDir = "C:\Build"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $buildDir | Out-Null

          Write-Host "========================================"
          Write-Host "INSTALLATION METATRADER 5"
          Write-Host "========================================"

          $installer = "$buildDir\mt5setup.exe"

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            Write-Error "Impossible de telecharger MT5."
            exit 1
          }

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/auto" `
            -Wait

          Write-Host "Installation de MT5 terminee."

      # ============================================================
      # 3. RECHERCHE DE METAEDITOR
      # ============================================================
      - name: Trouver MetaEditor
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "RECHERCHE METAEDITOR"
          Write-Host "========================================"

          $metaeditor = Get-ChildItem `
            -Path "C:\Program Files" `
            -Filter "metaeditor64.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $metaeditor) {
            $metaeditor = Get-ChildItem `
              -Path "C:\Program Files (x86)" `
              -Filter "metaeditor64.exe" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $metaeditor) {
            Write-Error "MetaEditor64.exe introuvable."
            exit 1
          }

          Write-Host "MetaEditor trouve :"
          Write-Host $metaeditor.FullName

          "METAEDITOR_PATH=$($metaeditor.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8

      # ============================================================
      # 4. VERIFIER LA STANDARD LIBRARY PRESENTE DANS LE DEPOT
      # ============================================================
      - name: Verifier la Standard Library MQL5
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "VERIFICATION STANDARD LIBRARY"
          Write-Host "========================================"

          $mql5Root = Join-Path `
            $env:GITHUB_WORKSPACE `
            "MQL5"

          $includeDir = Join-Path `
            $mql5Root `
            "Include"

          $tradeFile = Join-Path `
            $includeDir `
            "Trade\Trade.mqh"

          Write-Host "Racine MQL5 : $mql5Root"
          Write-Host "Include      : $includeDir"
          Write-Host "Trade.mqh    : $tradeFile"

          if (-not (Test-Path $mql5Root)) {
            Write-Error "Le dossier MQL5 est absent du depot."
            exit 1
          }

          if (-not (Test-Path $includeDir)) {
            Write-Error "Le dossier MQL5\Include est absent du depot."
            exit 1
          }

          if (-not (Test-Path $tradeFile)) {
            Write-Error ""
            Write-Error "Trade\Trade.mqh est absent."
            Write-Error ""
            Write-Error "Le depot doit contenir :"
            Write-Error "MQL5\Include\Trade\Trade.mqh"
            Write-Error ""
            Write-Error "Aucune bibliotheque externe ne sera telechargee."
            exit 1
          }

          Write-Host ""
          Write-Host "Trade.mqh trouve."

          $mqhFiles = Get-ChildItem `
            -Path $includeDir `
            -Filter "*.mqh" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Nombre de fichiers MQH : $($mqhFiles.Count)"

          if ($mqhFiles.Count -eq 0) {
            Write-Error "Aucun fichier MQH dans MQL5\Include."
            exit 1
          }

          Write-Host ""
          Write-Host "Standard Library valide."

      # ============================================================
      # 5. RECHERCHE DU ROBOT
      # ============================================================
      - name: Trouver le robot
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "RECHERCHE DU ROBOT MQ5"
          Write-Host

name: Compile MQL5

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer MetaTrader 5
        shell: pwsh
        run: |
          $buildDir = "C:\Build"

          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null

          Write-Host "Telechargement de MetaTrader 5..."

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile "$buildDir\mt5setup.exe"

          Write-Host "Installation de MetaTrader 5..."

          Start-Process `
            -FilePath "$buildDir\mt5setup.exe" `
            -ArgumentList "/auto" `
            -Wait

          Write-Host "Installation terminee."

      - name: Trouver MetaEditor
        shell: pwsh
        run: |
          Write-Host "Recherche de MetaEditor64.exe..."

          $metaeditor = Get-ChildItem `
            -Path "C:\Program Files" `
            -Filter "metaeditor64.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $metaeditor) {
            $metaeditor = Get-ChildItem `
              -Path "C:\Program Files (x86)" `
              -Filter "metaeditor64.exe" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $metaeditor) {
            Write-Error "MetaEditor64.exe introuvable."
            exit 1
          }

          Write-Host "MetaEditor trouve :"
          Write-Host $metaeditor.FullName

          "METAEDITOR_PATH=$($metaeditor.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8

      - name: Compiler le robot
        shell: pwsh
        run: |
          $buildDir = "C:\Build"
          $logFile = "$buildDir\compile.log"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $buildDir | Out-Null

          Write-Host "========================================"
          Write-Host "RECHERCHE DU FICHIER MQ5"
          Write-Host "========================================"

          $sourceFile = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $sourceFile) {
            Write-Error "Fichier BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5 introuvable."

            Write-Host ""
            Write-Host "Fichiers MQ5 disponibles :"

            Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Filter "*.mq5" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host $_.FullName
              }

            exit 1
          }

          Write-Host "Fichier MQ5 trouve :"
          Write-Host $sourceFile.FullName

          Write-Host ""
          Write-Host "========================================"
          Write-Host "COMPILATION MQL5"
          Write-Host "========================================"

          Write-Host "MetaEditor : $env:METAEDITOR_PATH"
          Write-Host "Source     : $($sourceFile.FullName)"
          Write-Host "Log        : $logFile"

          if (Test-Path $logFile) {
            Remove-Item $logFile -Force
          }

          $arguments = @(
            "/compile:$($sourceFile.FullName)"
            "/log:$logFile"
          )

          $process = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host ""
          Write-Host "Code retour MetaEditor : $($process.ExitCode)"

          Start-Sleep -Seconds 3

          Write-Host ""
          Write-Host "========================================"
          Write-Host "JOURNAL DE COMPILATION"
          Write-Host "========================================"

          if (Test-Path $logFile) {
            Get-Content `
              $logFile `
              -ErrorAction SilentlyContinue
          }
          else {
            Write-Warning "Le fichier compile.log n'a pas ete cree."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "RECHERCHE DU FICHIER EX5"
          Write-Host "========================================"

          $ex5Files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "*.ex5" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $ex5Files) {
            $ex5Files = Get-ChildItem `
              -Path "C:\Build" `
              -Filter "*.ex5" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue
          }

          if (-not $ex5Files) {
            Write-Error "Aucun fichier EX5 n'a ete genere."

            Write-Host ""
            Write-Host "Contenu du depot :"

            Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length |
              Format-Table -AutoSize

            exit 1
          }

          Write-Host "Fichier(s) EX5 trouve(s) :"

          foreach ($file in $ex5Files) {
            Write-Host $file.FullName
          }

          $expectedName = [System.IO.Path]::GetFileNameWithoutExtension(
            $sourceFile.Name
          ) + ".ex5"

          $mainEx5 = $ex5Files |
            Where-Object {
              $_.Name -eq $expectedName
            } |
            Select-Object -First 1

          if (-not $mainEx5) {
            $mainEx5 = $ex5Files | Select-Object -First 1
          }

          Write-Host ""
          Write-Host "EX5 selectionne :"
          Write-Host $mainEx5.FullName

          Copy-Item `
            -Path $mainEx5.FullName `
            -Destination "$buildDir\$($mainEx5.Name)" `
            -Force

          Write-Host ""
          Write-Host "Fichier EX5 final :"
          Write-Host "$buildDir\$($mainEx5.Name)"

          if ($process.ExitCode -ne 0) {
            Write-Error "MetaEditor a retourne le code $($process.ExitCode)."
            exit $process.ExitCode
          }

      - name: Recuperer le fichier compile
        uses: actions/upload-artifact@v4
        with:
          name: Robot-Compile
          path: C:\Build\*.ex5
          if-no-files-found: error

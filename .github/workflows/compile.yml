name: Compile MQL
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Telecharger MetaEditor et bibliotheques MQL5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Build" | Out-Null
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/metaeditor64.exe" -OutFile "C:\Build\metaeditor64.exe"
          Copy-Item "BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5" -Destination "C:\Build\BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5"

      - name: Compiler le robot
        shell: pwsh
        run: |
          & "C:\Build\metaeditor64.exe" /compile:"C:\Build\BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5" /log:"C:\Build\compile.log"
          if (Test-Path "C:\Build\compile.log") {
            Get-Content "C:\Build\compile.log" -Encoding Unicode
          }
          Get-ChildItem -Path "C:\Build"

      - name: Recuperer le fichier compile
        uses: actions/upload-artifact@v4
        with:
          name: Robot-Compile
          path: C:\Build\*.ex5
          if-no-files-found: error

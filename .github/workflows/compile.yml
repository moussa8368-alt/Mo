      - name: Compiler le robot
        shell: pwsh
        run: |

          $buildDir = "C:\Build"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $buildDir | Out-Null

          Write-Host "========================================"
          Write-Host "PREPARATION DE LA COMPILATION"
          Write-Host "========================================"

          # Recherche du fichier MQ5
          $sourceFile = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $sourceFile) {
            Write-Error "Fichier MQ5 introuvable."
            exit 1
          }

          Write-Host "Source trouvee :"
          Write-Host $sourceFile.FullName

          # Recherche de MetaEditor
          $metaeditor = Get-ChildItem `
            -Path "C:\Program Files" `
            -Filter "metaeditor64.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $metaeditor) {
            Write-Error "MetaEditor64.exe introuvable."
            exit 1
          }

          Write-Host ""
          Write-Host "MetaEditor :"
          Write-Host $metaeditor.FullName

          # ==========================================================
          # CREATION D'UN DOSSIER DE TRAVAIL MQL5
          # ==========================================================

          $mql5Dir = "C:\Build\MQL5"
          $expertsDir = "$mql5Dir\Experts"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $expertsDir | Out-Null

          # Copie du robot
          $localSource = "$expertsDir\$($sourceFile.Name)"

          Copy-Item `
            -Path $sourceFile.FullName `
            -Destination $localSource `
            -Force

          Write-Host ""
          Write-Host "Copie du robot :"
          Write-Host $localSource

          # ==========================================================
          # COMPILATION
          # ==========================================================

          $logFile = "$buildDir\compile.log"

          if (Test-Path $logFile) {
            Remove-Item $logFile -Force
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "LANCEMENT DE METAEDITOR"
          Write-Host "========================================"

          $arguments = @(
            "/compile:$localSource"
            "/log:$logFile"
          )

          Write-Host "Arguments :"
          $arguments | ForEach-Object {
            Write-Host $_
          }

          $process = Start-Process `
            -FilePath $metaeditor.FullName `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host ""
          Write-Host "Code retour MetaEditor : $($process.ExitCode)"

          # ==========================================================
          # JOURNAL
          # ==========================================================

          Start-Sleep -Seconds 3

          if (Test-Path $logFile) {

            Write-Host ""
            Write-Host "========================================"
            Write-Host "JOURNAL METAEDITOR"
            Write-Host "========================================"

            Get-Content `
              $logFile `
              -ErrorAction SilentlyContinue

            Write-Host "========================================"

          } else {

            Write-Host ""
            Write-Warning "Le fichier compile.log n'existe pas."

          }

          # ==========================================================
          # RECHERCHE EX5
          # ==========================================================

          Write-Host ""
          Write-Host "========================================"
          Write-Host "RECHERCHE DU FICHIER EX5"
          Write-Host "========================================"

          $ex5Files = Get-ChildItem `
            -Path "C:\Build" `
            -Filter "*.ex5" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $ex5Files) {

            Write-Host ""
            Write-Host "Aucun EX5 dans C:\Build."
            Write-Host ""
            Write-Host "Recherche dans le dossier du robot..."

            $ex5Files = Get-ChildItem `
              -Path $expertsDir `
              -Filter "*.ex5" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue
          }

          if (-not $ex5Files) {

            Write-Host ""
            Write-Host "AUCUN FICHIER EX5 GENERE."
            Write-Host ""

            Write-Host "Contenu du dossier MQL5 :"

            Get-ChildItem `
              -Path $mql5Dir `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length |
              Format-Table -AutoSize

            exit 1
          }

          Write-Host ""
          Write-Host "EX5 TROUVE :"

          foreach ($file in $ex5Files) {
            Write-Host $file.FullName
          }

          # ==========================================================
          # COPIE DU RESULTAT
          # ==========================================================

          $expectedName = [System.IO.Path]::GetFileNameWithoutExtension(
            $sourceFile.Name
          ) + ".ex5"

          $mainEx5 = $ex5Files |
            Where-Object {
              $_.Name -eq $expectedName
            } |
            Select-Object -First 1

          if (-not $mainEx5) {
            $mainEx5 = $ex5Files | Select-Object -First 1
          }

          Copy-Item `
            -Path $mainEx5.FullName `
            -Destination "$buildDir\$($mainEx5.Name)" `
            -Force

          Write-Host ""
          Write-Host "========================================"
          Write-Host "COMPILATION TERMINEE"
          Write-Host "========================================"

          Write-Host "EX5 final :"
          Write-Host "$buildDir\$($mainEx5.Name)"

          Get-ChildItem `
            -Path $buildDir `
            -Filter "*.ex5" |
            Format-Table Name, Length, LastWriteTime -AutoSize

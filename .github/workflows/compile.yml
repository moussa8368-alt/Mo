name: Compile MQL
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Telecharger et lancer mt5setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Build" | Out-Null
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile "C:\Build\mt5setup.exe"
          Start-Process -FilePath "C:\Build\mt5setup.exe" -ArgumentList "/auto" -Wait
          Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue

      - name: Compiler le robot
        shell: pwsh
        run: |
          $metaeditor = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $metaeditor) {
            Write-Host "metaeditor64.exe non trouve apres /auto"
            Get-ChildItem -Path "C:\Build"
            exit 1
          }
          Copy-Item "BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5" -Destination "C:\Build\BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5"
          & $metaeditor.FullName /compile:"C:\Build\BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5" /log:"C:\Build\compile.log"
          if (Test-Path "C:\Build\compile.log") {
            Get-Content "C:\Build\compile.log" -Encoding Unicode
          }
          Get-ChildItem -Path "C:\Build"

      - name: Recuperer le fichier compile
        uses: actions/upload-artifact@v4
        with:
          name: Robot-Compile
          path: C:\Build\*.ex5
          if-no-files-found: error

name: Compile MQL5

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. RECUPERER LE CODE
      # ============================================================
      - name: Recuperer le code
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALLER METATRADER 5
      # ============================================================
      - name: Installer MetaTrader 5
        shell: pwsh
        run: |
          $buildDir = "C:\Build"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $buildDir | Out-Null

          Write-Host "========================================"
          Write-Host "INSTALLATION METATRADER 5"
          Write-Host "========================================"

          $installer = "$buildDir\mt5setup.exe"

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            Write-Error "mt5setup.exe introuvable."
            exit 1
          }

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/auto" `
            -Wait

          Write-Host "Installation MT5 terminee."


      # ============================================================
      # 3. TROUVER METAEDITOR
      # ============================================================
      - name: Trouver MetaEditor
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "RECHERCHE METAEDITOR"
          Write-Host "========================================"

          $metaeditor = Get-ChildItem `
            -Path "C:\Program Files" `
            -Filter "metaeditor64.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $metaeditor) {
            $metaeditor = Get-ChildItem `
              -Path "C:\Program Files (x86)" `
              -Filter "metaeditor64.exe" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $metaeditor) {
            Write-Error "MetaEditor64.exe introuvable."
            exit 1
          }

          Write-Host "MetaEditor trouve :"
          Write-Host $metaeditor.FullName

          "METAEDITOR_PATH=$($metaeditor.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8


      # ============================================================
      # 4. INITIALISER LA STANDARD LIBRARY MQL5
      # ============================================================
      - name: Initialiser la Standard Library MQL5
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "INITIALISATION STANDARD LIBRARY MQL5"
          Write-Host "========================================"

          $terminal = Get-ChildItem `
            -Path "C:\Program Files" `
            -Filter "terminal64.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $terminal) {
            Write-Error "terminal64.exe introuvable."
            exit 1
          }

          Write-Host "Terminal MT5 trouve :"
          Write-Host $terminal.FullName

          $terminalDir = Split-Path -Parent $terminal.FullName
          $mql5Root = Join-Path $terminalDir "MQL5"

          Write-Host "Racine MQL5 : $mql5Root"

          $process = Start-Process `
            -FilePath $terminal.FullName `
            -ArgumentList "/portable" `
            -PassThru

          Write-Host "MT5 demarre."

          $tradeFile = Join-Path `
            $mql5Root `
            "Include\Trade\Trade.mqh"

          Write-Host "Attente de Trade.mqh..."

          $found = $false

          for ($i = 1; $i -le 60; $i++) {

            if (Test-Path $tradeFile) {
              $found = $true
              break
            }

            Write-Host "Attente... $i / 60"
            Start-Sleep -Seconds 2
          }

          try {
            Stop-Process `
              -Id $process.Id `
              -Force `
              -ErrorAction SilentlyContinue
          }
          catch {
          }

          if (-not $found) {
            Write-Error "Trade.mqh introuvable."
            Write-Error "Chemin : $tradeFile"
            exit 1
          }

          Write-Host ""
          Write-Host "Standard Library detectee."
          Write-Host "Trade.mqh : $tradeFile"

          "MQL5_ROOT=$mql5Root" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8


      # ============================================================
      # 5. VERIFIER LA STANDARD LIBRARY
      # ============================================================
      - name: Verifier la Standard Library MQL5
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "VERIFICATION STANDARD LIBRARY"
          Write-Host "========================================"

          $mql5Root = $env:MQL5_ROOT

          $tradeFile = Join-Path `
            $mql5Root `
            "Include\Trade\Trade.mqh"

          Write-Host "Racine MQL5 : $mql5Root"
          Write-Host "Trade.mqh   : $tradeFile"

          if (-not (Test-Path $tradeFile)) {
            Write-Error "Trade.mqh absent."
            exit 1
          }

          Write-Host ""
          Write-Host "Trade.mqh OK."


      # ============================================================
      # 6. CREER UN CHEMIN SANS ESPACES
      # ============================================================
      - name: Creer chemin MQL5 sans espaces
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "CREATION DU CHEMIN MQL5"
          Write-Host "========================================"

          $mql5Root = $env:MQL5_ROOT
          $linkPath = "C:\MQL5"

          if (Test-Path $linkPath) {
            Write-Host "C:\MQL5 existe deja."

            $item = Get-Item $linkPath -Force

            if (-not $item.PSIsContainer) {
              Remove-Item $linkPath -Force
            }
          }

          if (-not (Test-Path $linkPath)) {

            Write-Host "Creation du junction :"
            Write-Host "$linkPath -> $mql5Root"

            cmd.exe /c "mklink /J `"$linkPath`" `"$mql5Root`""

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Impossible de creer le junction C:\MQL5."
              exit 1
            }
          }

          if (-not (Test-Path "C:\MQL5\Include\Trade\Trade.mqh")) {
            Write-Error "Trade.mqh inaccessible via C:\MQL5."
            exit 1
          }

          Write-Host ""
          Write-Host "Chemin court MQL5 OK."
          Write-Host "C:\MQL5\Include\Trade\Trade.mqh"

          "MQL5_COMPILE_ROOT=C:\MQL5" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8


      # ============================================================
      # 7. TROUVER LE ROBOT
      # ============================================================
      - name: Trouver le robot
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "RECHERCHE DU FICHIER MQ5"
          Write-Host "========================================"

          $sourceFile = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $sourceFile) {
            Write-Error "BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5 introuvable."
            exit 1
          }

          Write-Host "Fichier MQ5 trouve :"
          Write-Host $sourceFile.FullName

          "SOURCE_FILE=$($sourceFile.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8


      # ============================================================
      # 8. COMPILER LE ROBOT
      # ============================================================
      - name: Compiler le robot
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "COMPILATION MQL5"
          Write-Host "========================================"

          $sourceFile = $env:SOURCE_FILE
          $metaeditor = $env:METAEDITOR_PATH
          $includeRoot = $env:MQL5_COMPILE_ROOT
          $buildDir = "C:\Build"
          $logFile = "$buildDir\compile.log"

          if (-not (Test-Path $sourceFile)) {
            Write-Error "Source introuvable : $sourceFile"
            exit 1
          }

          if (-not (Test-Path $metaeditor)) {
            Write-Error "MetaEditor introuvable : $metaeditor"
            exit 1
          }

          if (-not (Test-Path "$includeRoot\Include\Trade\Trade.mqh")) {
            Write-Error "Trade.mqh introuvable dans $includeRoot"
            exit 1
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $buildDir | Out-Null

          if (Test-Path $logFile) {
            Remove-Item `
              $logFile `
              -Force
          }

          Write-Host ""
          Write-Host "MetaEditor : $metaeditor"
          Write-Host "Source     : $sourceFile"
          Write-Host "Include    : $includeRoot"
          Write-Host "Log        : $logFile"

          Write-Host ""
          Write-Host "Lancement de MetaEditor..."

          # IMPORTANT :
          # Aucun espace dans C:\MQL5.
          # Cela evite le probleme observe :
          # C:\Program\Include\Trade\Trade.mqh

          & $metaeditor `
            "/compile:$sourceFile" `
            "/include:$includeRoot" `
            "/log:$logFile"

          $metaEditorExitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Code retour MetaEditor : $metaEditorExitCode"

          Start-Sleep -Seconds 3

          # ========================================================
          # JOURNAL
          # ========================================================

          Write-Host ""
          Write-Host "========================================"
          Write-Host "JOURNAL DE COMPILATION"
          Write-Host "========================================"

          if (-not (Test-Path $logFile)) {
            Write-Error "compile.log introuvable."
            exit 1
          }

          $logContent = Get-Content `
            -Path $logFile `
            -Encoding Unicode

          $logContent | ForEach-Object {
            Write-Host $_
          }

          # ========================================================
          # RESULTAT
          # ========================================================

          Write-Host ""
          Write-Host "========================================"
          Write-Host "RESULTAT DE LA COMPILATION"
          Write-Host "========================================"

          $resultLine = $logContent |
            Where-Object {
              $_ -match "^Result:"
            } |
            Select-Object -Last 1

          if (-not $resultLine) {
            Write-Error "Aucune ligne Result trouvee."
            exit 1
          }

          Write-Host $resultLine

          if ($resultLine -match "Result:\s*0 errors,\s*0 warnings") {

            Write-Host ""
            Write-Host "COMPILATION REUSSIE."

          }
          elseif ($resultLine -match "Result:\s*0 errors") {

            Write-Warning "Compilation reussie avec des warnings."

          }
          else {

            Write-Error "La compilation contient des erreurs."
            exit 1
          }

          # ========================================================
          # RECHERCHE DU EX5
          # ========================================================

          Write-Host ""
          Write-Host "========================================"
          Write-Host "RECHERCHE DU FICHIER EX5"
          Write-Host "========================================"

          $sourceName = [System.IO.Path]::GetFileNameWithoutExtension(
            $sourceFile
          )

          $sourceDirectory = Split-Path `
            -Parent `
            $sourceFile

          $expectedEx5 = Join-Path `
            $sourceDirectory `
            "$sourceName.ex5"

          $ex5File = $null

          if (Test-Path $expectedEx5) {

            $ex5File = Get-Item `
              $expectedEx5

          }
          else {

            Write-Host "Recherche du EX5 dans le workspace..."

            $ex5File = Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Filter "$sourceName.ex5" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $ex5File) {
            Write-Error "Aucun fichier EX5 n'a ete genere."
            exit 1
          }

          Write-Host ""
          Write-Host "EX5 trouve :"
          Write-Host $ex5File.FullName

          # ========================================================
          # COPIER LE RESULTAT
          # ========================================================

          Copy-Item `
            -Path $ex5File.FullName `
            -Destination "$buildDir\$sourceName.ex5" `
            -Force

          Copy-Item `
            -Path $logFile `
            -Destination "$buildDir\compile.log" `
            -Force

          Write-Host ""
          Write-Host "========================================"
          Write-Host "BUILD TERMINE"
          Write-Host "========================================"

          Write-Host "EX5 : $buildDir\$sourceName.ex5"
          Write-Host "LOG : $buildDir\compile.log"


      # ============================================================
      # 9. RECUPERER LES ARTIFACTS
      # ============================================================
      - name: Recuperer le fichier compile
        uses: actions/upload-artifact@v4
        with:
          name: Robot-Compile
          path: |
            C:\Build\*.ex5
            C:\Build\compile.log
          if-no-files-found: error

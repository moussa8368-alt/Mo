name: Compile MQL5

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. RECUPERER LE CODE
      # ============================================================
      - name: Recuperer le code
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALLER METATRADER 5
      # ============================================================
      - name: Installer MetaTrader 5
        shell: pwsh
        run: |
          $BuildDir = "C:\Build"

          New-Item -ItemType Directory -Force -Path $BuildDir | Out-Null

          $Installer = "$BuildDir\mt5setup.exe"

          Write-Host "=============================================="
          Write-Host "TELECHARGEMENT DE METATRADER 5"
          Write-Host "=============================================="

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $Installer

          Write-Host "Installation de MetaTrader 5..."

          Start-Process `
            -FilePath $Installer `
            -ArgumentList "/auto" `
            -Wait

          Write-Host "Installation terminee."

      # ============================================================
      # 3. TROUVER METAEDITOR
      # ============================================================
      - name: Trouver MetaEditor
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "RECHERCHE METAEDITOR"
          Write-Host "=============================================="

          $Candidates = @(
            "C:\Program Files\MetaTrader 5\MetaEditor64.exe",
            "C:\Program Files (x86)\MetaTrader 5\MetaEditor64.exe"
          )

          $MetaEditor = $null

          foreach ($Path in $Candidates) {
            if (Test-Path $Path) {
              $MetaEditor = $Path
              break
            }
          }

          if (-not $MetaEditor) {
            $MetaEditor = Get-ChildItem `
              -Path "C:\Program Files" `
              -Filter "MetaEditor64.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 |
              Select-Object -ExpandProperty FullName
          }

          if (-not $MetaEditor) {
            Write-Error "MetaEditor64.exe introuvable."
            exit 1
          }

          Write-Host "MetaEditor trouve :"
          Write-Host $MetaEditor

          "METAEDITOR_PATH=$MetaEditor" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      # ============================================================
      # 4. TROUVER LE FICHIER MQ5
      # ============================================================
      - name: Trouver le robot
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "RECHERCHE DU ROBOT MQ5"
          Write-Host "=============================================="

          $SourceFile = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $SourceFile) {
            Write-Error "Fichier BlackHippo_Buffalo_Pelerin_v1_10_AUDITED.mq5 introuvable."
            exit 1
          }

          Write-Host "Robot trouve :"
          Write-Host $SourceFile.FullName

          "SOURCE_FILE=$($SourceFile.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      # ============================================================
      # 5. PREPARER L'ENVIRONNEMENT MQL5
      # ============================================================
      - name: Initialiser l'environnement MQL5
        shell: pwsh
        run: |
          $MQL5Root = "C:\Build\MQL5"

          New-Item -ItemType Directory -Force -Path "$MQL5Root\Experts" | Out-Null
          New-Item -ItemType Directory -Force -Path "$MQL5Root\Include" | Out-Null

          Write-Host "MQL5 Root : $MQL5Root"

          # Copier le robot dans Experts
          Copy-Item `
            -Path $env:SOURCE_FILE `
            -Destination "$MQL5Root\Experts\" `
            -Force

          # Rechercher la Standard Library fournie avec MetaTrader
          $TradeMqh = Get-ChildItem `
            -Path "C:\Program Files" `
            -Filter "Trade.mqh" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $TradeMqh) {
            Write-Error "Trade.mqh introuvable dans l'installation MetaTrader 5."
            exit 1
          }

          Write-Host "Trade.mqh trouve :"
          Write-Host $TradeMqh.FullName

          $StandardInclude = Split-Path $TradeMqh.FullName -Parent

          Write-Host "Standard Library :"
          Write-Host $StandardInclude

          # Copier toute la Standard Library
          Copy-Item `
            -Path "$StandardInclude\*" `
            -Destination "$MQL5Root\Include\" `
            -Recurse `
            -Force

          "MQL5_ROOT=$MQL5Root" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      # ============================================================
      # 6. VERIFICATION DES FICHIERS
      # ============================================================
      - name: Verifier les bibliotheques MQL5
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "VERIFICATION STANDARD LIBRARY"
          Write-Host "=============================================="

          $Trade = "$env:MQL5_ROOT\Include\Trade\Trade.mqh"

          if (-not (Test-Path $Trade)) {
            Write-Error "Trade.mqh absent : $Trade"
            exit 1
          }

          Write-Host "Trade.mqh OK"

          $Object = "$env:MQL5_ROOT\Include\Trade\Object.mqh"

          if (Test-Path $Object) {
            Write-Host "Object.mqh OK"
          }

          $Files = Get-ChildItem `
            -Path "$env:MQL5_ROOT\Include" `
            -Recurse `
            -Filter "*.mqh" `
            -ErrorAction SilentlyContinue

          Write-Host "Nombre de fichiers MQH : $($Files.Count)"

      # ============================================================
      # 7. COMPILER LE ROBOT
      # ============================================================
      - name: Compiler le robot
        shell: pwsh
        run: |
          $BuildDir = "C:\Build"
          $LogFile = "$BuildDir\compile.log"

          New-Item -ItemType Directory -Force -Path $BuildDir | Out-Null

          $SourceName = Split-Path $env:SOURCE_FILE -Leaf
          $SourceCopy = "$env:MQL5_ROOT\Experts\$SourceName"

          Write-Host "=============================================="
          Write-Host "COMPILATION MQL5"
          Write-Host "=============================================="

          Write-Host "MetaEditor : $env:METAEDITOR_PATH"
          Write-Host "Source     : $SourceCopy"
          Write-Host "MQL5 Root  : $env:MQL5_ROOT"
          Write-Host "Log        : $LogFile"

          if (Test-Path $LogFile) {
            Remove-Item $LogFile -Force
          }

          # Compilation
          $Arguments = @(
            "/compile:`"$SourceCopy`"",
            "/log:`"$LogFile`""
          )

          Write-Host "Lancement de MetaEditor..."

          $Process = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList $Arguments `
            -Wait `
            -PassThru

          Write-Host "Code retour MetaEditor : $($Process.ExitCode)"

          Start-Sleep -Seconds 3

          # Afficher le journal
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "JOURNAL DE COMPILATION"
          Write-Host "=============================================="

          if (Test-Path $LogFile) {
            Get-Content $LogFile -ErrorAction SilentlyContinue
          }
          else {
            Write-Error "Le fichier compile.log n'a pas ete genere."
            exit 1
          }

          # ========================================================
          # RECHERCHE EX5
          # ========================================================
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "RECHERCHE DU FICHIER EX5"
          Write-Host "=============================================="

          $ExpectedEX5 = "$env:MQL5_ROOT\Experts\$([System.IO.Path]::GetFileNameWithoutExtension($SourceName)).ex5"

          Write-Host "EX5 attendu :"
          Write-Host $ExpectedEX5

          if (-not (Test-Path $ExpectedEX5)) {

            Write-Host ""
            Write-Host "Fichiers EX5 trouves :"

            Get-ChildItem `
              -Path $env:MQL5_ROOT `
              -Filter "*.ex5" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host $_.FullName
              }

            Write-Error "Aucun fichier EX5 n'a ete genere."
            exit 1
          }

          Write-Host ""
          Write-Host "EX5 genere avec succes :"
          Write-Host $ExpectedEX5

          # Copier le resultat
          Copy-Item `
            -Path $ExpectedEX5 `
            -Destination "$BuildDir\$([System.IO.Path]::GetFileName($ExpectedEX5))" `
            -Force

          # Copier le journal
          Copy-Item `
            -Path $LogFile `
            -Destination "$BuildDir\compile.log" `
            -Force

          # Le workflow echoue seulement si la compilation n'a pas produit d'EX5
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "BUILD TERMINE"
          Write-Host "=============================================="

      # ============================================================
      # 8. RECUPERER LES ARTIFACTS
      # ============================================================
      - name: Recuperer le fichier compile
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Robot-Compile
          path: |
            C:\Build\*.ex5
            C:\Build\compile.log
          if-no-files-found: error

      # ============================================================
      # 9. CONSERVER LE LOG EN CAS D'ECHEC
      # ============================================================
      - name: Recuperer le journal en cas d'erreur
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Compilation-Logs
          path: |
            C:\Build\compile.log
          if-no-files-found: ignore
